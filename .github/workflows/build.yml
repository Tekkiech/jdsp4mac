# Build and golden checks on every push and PR. A GitHub Release (ad-hoc signed zip + sha256) is
# published when:
#   - a push to main carries a MARKETING_VERSION (project.yml) that has no v<version> release yet:
#     bump the version, push, and the release appears;
#   - a v* tag is pushed;
#   - or from the Actions tab: "build" > Run workflow with a version (e.g. 0.1.0).
# The release creates the v<version> tag on the built commit. Apple silicon runner; no
# notarisation (see README).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0 (creates tag v<version>)"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write   # gh release create

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      - name: Select the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Golden DSP checks
        run: Tests/golden.sh

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PROJECT_VERSION="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml | head -1)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            VERSION="${INPUT_VERSION#v}"
            echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must look like 1.2.3, got '$VERSION'"; exit 1; }
            RELEASE=true
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"; RELEASE=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = main ] \
               && ! gh release view "v$PROJECT_VERSION" >/dev/null 2>&1; then
            # A version nobody has released yet: this push releases it.
            VERSION="$PROJECT_VERSION"; RELEASE=true
          else
            VERSION="$PROJECT_VERSION-dev"; RELEASE=false
          fi
          echo "version $VERSION, release $RELEASE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Release build
        run: scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: jdsp4mac
          path: build/dist/*.zip*

      - name: GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # On a manual run gh creates the tag at this commit; on a tag push it already exists.
          gh release create "v$VERSION" build/dist/*.zip build/dist/*.zip.sha256 \
            --target "$GITHUB_SHA" --title "jdsp4mac $VERSION" --generate-notes \
            $([ "$PRERELEASE" = true ] && echo --prerelease)
